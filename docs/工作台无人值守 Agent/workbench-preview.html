<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent 工作台 · 设计预览</title>
<style>
  :root {
    color-scheme: light;

    --app-bg: #e6e8ee;
    --nav-bg: #fbfcfd;
    --content-bg: #f4f5f8;
    --surface: #ffffff;

    --ink: #111827;
    --ink-2: #4b5563;
    --ink-3: #6b7280;
    --line: #e6e8ee;
    --line-strong: #d6dae2;

    --accent: #1677ff;
    --accent-soft: #eaf3ff;

    /* 与 yunxiao-web getWorkItemStatusColor 对齐 */
    --s-todo: #1890ff;
    --s-doing: #722ed1;
    --s-review: #13c2c2;
    --s-done: #52c41a;
    --s-blocked: #ff7a45;

    /* 与 WorkItemTable 的类型徽标对齐 */
    --t-req: #1677ff;
    --t-task: #52c41a;
    --t-bug: #ff4d4f;

    --card-shadow: 0 1px 2px rgba(16, 24, 40, .05);
    --card-shadow-hover: 0 2px 4px rgba(16, 24, 40, .05), 0 14px 28px -18px rgba(16, 24, 40, .45);
    --drawer-shadow: 0 0 0 1px rgba(16, 24, 40, .07), 0 32px 64px -32px rgba(16, 24, 40, .55);

    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;

      --app-bg: #07090d;
      --nav-bg: #0d1117;
      --content-bg: #0a0e14;
      --surface: #151b24;

      --ink: #eef2f8;
      --ink-2: #a7b1c0;
      --ink-3: #7f8a9a;
      --line: rgba(255, 255, 255, .08);
      --line-strong: rgba(255, 255, 255, .16);

      --accent: #5ea9ff;
      --accent-soft: rgba(94, 169, 255, .14);

      --s-todo: #4aa8ff;
      --s-doing: #a97cf5;
      --s-review: #43d6d6;
      --s-done: #8ada64;
      --s-blocked: #ffa072;

      --t-req: #5ea9ff;
      --t-task: #8ada64;
      --t-bug: #ff8b8b;

      --card-shadow: 0 1px 2px rgba(0, 0, 0, .5);
      --card-shadow-hover: 0 10px 26px -16px rgba(0, 0, 0, .9);
      --drawer-shadow: 0 0 0 1px rgba(255, 255, 255, .09), 0 32px 64px -32px rgba(0, 0, 0, .95);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 10px;
    background: var(--app-bg);
    color: var(--ink);
    font: 13px/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  svg { display: block; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  ::selection { background: color-mix(in srgb, var(--accent) 24%, transparent); color: var(--ink); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--ink-3) 26%, transparent);
    border: 3px solid transparent; background-clip: padding-box; border-radius: 8px;
  }
  ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--ink-3) 42%, transparent); background-clip: padding-box; }

  .app {
    --nav-w: 208px;
    height: calc(100vh - 20px);
    display: grid;
    grid-template-columns: var(--nav-w) minmax(0, 1fr) 360px;
    background: var(--content-bg);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(16, 24, 40, .07), 0 24px 60px -40px rgba(16, 24, 40, .5);
  }

  /* ── 左侧菜单 ────────────────────────────── */
  .nav {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--nav-bg);
    border-right: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 9px; height: 56px; padding: 0 14px; flex: 0 0 auto; }
  .brand-icon { width: 20px; height: 20px; flex: 0 0 auto; color: var(--accent); }
  .brand b { font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }

  .nav-scroll { flex: 1; min-height: 0; overflow: auto; padding: 4px 8px 12px; }
  .nav-label { padding: 14px 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--ink-3); }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; height: 34px; padding: 0 10px; border-radius: 8px;
    color: var(--ink-2); font-size: 13px; text-align: left;
    transition: background .14s ease, color .14s ease;
  }
  .nav-item svg { width: 17px; height: 17px; flex: 0 0 auto; opacity: .8; }
  .nav-item:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); color: var(--ink); }
  .nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-item[aria-current="page"] svg { opacity: 1; }
  .nav-item .count {
    margin-left: auto; font-size: 11px; font-family: var(--mono);
    color: var(--ink-3); background: color-mix(in srgb, var(--ink) 6%, transparent);
    padding: 1px 6px; border-radius: 999px;
  }
  .nav-item[aria-current="page"] .count { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }

  .nav-foot { padding: 10px 12px 12px; border-top: 1px solid var(--line); }
  .me { display: flex; align-items: center; gap: 9px; padding: 6px 4px; border-radius: 8px; }
  .me:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex: 0 0 auto;
    display: grid; place-items: center; font-size: 12px; font-weight: 600;
    color: #fff; background: linear-gradient(140deg, #2f6fe8, #1d4ed8);
  }
  .me-text { min-width: 0; flex: 1; }
  .me-text b { display: block; font-size: 12.5px; font-weight: 600; }
  .me-text span { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--ink-3); }
  .me-text i { width: 5px; height: 5px; border-radius: 50%; background: var(--s-done); flex: 0 0 auto; }

  /* ── 主区 ───────────────────────────────── */
  .content { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  .topbar { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 20px; flex: 0 0 auto; }
  .topbar h1 { margin: 0; font-size: 16.5px; font-weight: 600; letter-spacing: -.015em; }
  .topbar .grow { flex: 1; }

  .search {
    display: flex; align-items: center; gap: 7px;
    flex: 0 1 230px; min-width: 132px;
    height: 32px; padding: 0 10px; border-radius: 8px;
    background: var(--surface); color: var(--ink-3);
    box-shadow: 0 0 0 1px var(--line);
  }
  .search:focus-within { box-shadow: 0 0 0 1px var(--accent), 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
  .search svg { width: 14px; height: 14px; flex: 0 0 auto; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 12.5px; color: var(--ink); }

  .icon-btn {
    display: grid; place-items: center;
    width: 32px; height: 32px; border-radius: 8px;
    color: var(--ink-2); background: var(--surface);
    box-shadow: 0 0 0 1px var(--line);
    transition: background .14s ease, color .14s ease;
  }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn:hover { color: var(--ink); background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
  .icon-btn[data-spin] svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .divider { width: 1px; height: 20px; background: var(--line); }

  /* 状态标签栏 */
  .statusbar { display: flex; align-items: center; gap: 4px; padding: 0 20px 10px; flex: 0 0 auto; flex-wrap: wrap; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px;
    height: 30px; padding: 0 10px; border-radius: 8px;
    font-size: 12.5px; color: var(--ink-2);
    transition: background .14s ease, color .14s ease;
  }
  .tab i { width: 7px; height: 7px; border-radius: 50%; background: var(--st); flex: 0 0 auto; }
  .tab b { font-weight: 600; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .tab:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); color: var(--ink); }
  .tab[aria-selected="true"] {
    background: color-mix(in srgb, var(--st) 12%, var(--surface));
    color: color-mix(in srgb, var(--st) 78%, var(--ink));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--st) 26%, transparent);
  }
  .tab[aria-selected="true"] b { color: inherit; }
  .statusbar .grow { flex: 1; }

  .ghost-btn {
    display: inline-flex; align-items: center; gap: 5px;
    height: 30px; padding: 0 9px; border-radius: 8px;
    font-size: 12.5px; color: var(--ink-3);
  }
  .ghost-btn:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); color: var(--ink); }
  .ghost-btn svg { width: 14px; height: 14px; }

  /* 卡片网格：3 列 → 4 列（收起详情）→ 2 → 1 */
  .grid {
    flex: 1; min-height: 0; overflow: auto;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px; padding: 2px 20px 24px; align-content: start;
  }

  .card {
    position: relative;
    display: flex; flex-direction: column;
    min-height: 150px; padding: 13px 13px 12px;
    text-align: left; border-radius: 12px;
    border: 1px solid color-mix(in srgb, var(--st) 17%, transparent);
    background: color-mix(in srgb, var(--st) 7%, var(--surface));
    box-shadow: var(--card-shadow);
    transition: transform .16s cubic-bezier(.2, .7, .3, 1), box-shadow .16s ease, border-color .16s ease, background .16s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--st) 30%, transparent);
    background: color-mix(in srgb, var(--st) 11%, var(--surface));
    box-shadow: var(--card-shadow-hover);
  }
  .card[aria-current="true"] {
    border-color: color-mix(in srgb, var(--st) 70%, var(--ink));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--st) 70%, var(--ink)), 0 16px 32px -22px color-mix(in srgb, var(--st) 60%, transparent);
  }

  .card-top { display: flex; align-items: center; gap: 8px; }

  /* 类型徽标：沿用 WorkItemTable 的渐变底 + 彩边 */
  .type {
    display: inline-flex; align-items: center; gap: 4px;
    height: 21px; padding: 0 7px; border-radius: 6px;
    font-size: 11px; font-weight: 600; letter-spacing: .01em;
    color: color-mix(in srgb, var(--ty) 68%, var(--ink));
    border: 1px solid color-mix(in srgb, var(--ty) 38%, transparent);
    /* 徽标压在彩色卡片上，必须比卡片更“白”才不会同色消失 */
    background: linear-gradient(135deg,
      color-mix(in srgb, var(--surface) 90%, var(--ty)) 0%,
      color-mix(in srgb, var(--surface) 96%, var(--ty)) 100%);
    flex: 0 0 auto;
  }
  .type svg { width: 11px; height: 11px; }

  /* 状态：点 + 文字，不再叠一层色块 */
  .status {
    display: inline-flex; align-items: center; gap: 5px;
    margin-left: auto; flex: 0 0 auto;
    font-size: 11.5px; font-weight: 600; white-space: nowrap;
    color: color-mix(in srgb, var(--st) 72%, var(--ink));
  }
  .status i { width: 6px; height: 6px; border-radius: 50%; background: var(--st); box-shadow: 0 0 0 3px color-mix(in srgb, var(--st) 16%, transparent); }

  .card-title {
    margin: 10px 0 0; font-size: 13.5px; font-weight: 600; line-height: 1.5; letter-spacing: -.002em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-meta {
    margin-top: 6px; display: flex; align-items: center; gap: 5px; min-width: 0;
    font-size: 11.5px; color: var(--ink-3);
  }
  .card-meta .serial { font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
  .card-meta .sep { color: var(--line-strong); }
  .card-meta .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-foot {
    margin-top: auto; padding-top: 10px;
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--ink-3);
  }
  .card-foot .grow { flex: 1; }

  .pill {
    display: inline-flex; align-items: center; height: 20px; padding: 0 6px;
    border-radius: 5px; font-size: 11px; font-family: var(--mono);
    background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink-2);
    max-width: 112px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .prio { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .prio[data-p="P0"] { color: #d4380d; font-weight: 600; }
  .prio[data-p="P1"] { color: #d46b08; }
  .cmt { display: inline-flex; align-items: center; gap: 3px; }
  .cmt svg { width: 12px; height: 12px; }

  /* ── 详情 ───────────────────────────────── */
  .detail { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--line); }
  .detail-head {
    padding: 16px 18px 13px; flex: 0 0 auto;
    background: color-mix(in srgb, var(--st) 6%, var(--surface));
    border-bottom: 1px solid var(--line);
  }
  .detail-top { display: flex; align-items: center; gap: 8px; }
  .detail-top .grow { flex: 1; }
  .detail-head h2 { margin: 10px 0 0; font-size: 16px; font-weight: 600; line-height: 1.45; letter-spacing: -.015em; }
  .detail-sub { margin-top: 7px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-3); }
  .detail-sub .serial { font-family: var(--mono); color: var(--ink-2); }

  .detail-body { flex: 1; min-height: 0; overflow: auto; padding: 2px 18px 18px; }
  .section { margin-top: 16px; }
  .section > h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--ink-3); }
  .props { display: grid; grid-template-columns: 1fr 1fr; gap: 11px 12px; }
  .prop span { display: block; font-size: 11px; color: var(--ink-3); margin-bottom: 2px; }
  .prop b { display: block; font-size: 12.5px; font-weight: 500; overflow-wrap: anywhere; }
  .prop b.mono { font-family: var(--mono); font-size: 12px; }

  .prose { font-size: 12.5px; line-height: 1.72; color: var(--ink-2); }
  .prose p { margin: 0; }

  .reasons { display: grid; gap: 7px; }
  .reason { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; line-height: 1.55; color: var(--ink-2); }
  .reason i { width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex: 0 0 auto; background: var(--s-done); }
  .reason[data-level="risk"] i { background: #faad14; }
  .reason[data-level="block"] i { background: #ff4d4f; }

  .chain { display: grid; }
  .chain-row {
    display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 10px;
    padding: 6px 0; font-size: 11.5px; border-bottom: 1px solid var(--line);
  }
  .chain-row:last-child { border-bottom: 0; }
  .chain-row .k { color: var(--ink-3); }
  .chain-row .v { color: var(--ink-2); overflow-wrap: anywhere; }
  .chain-row .s { color: #389e0d; white-space: nowrap; font-size: 11px; }
  .chain-row[data-state="warn"] .s { color: #d46b08; }
  .chain-row[data-state="bad"] .s { color: #cf1322; }

  .detail-foot { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 11px 18px; border-top: 1px solid var(--line); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; padding: 0 12px; border-radius: 8px;
    font-size: 12.5px; font-weight: 500; white-space: nowrap;
    background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink);
    transition: background .14s ease;
  }
  .btn:hover { background: color-mix(in srgb, var(--ink) 9%, transparent); }
  .btn[data-variant="primary"] { background: var(--accent); color: #fff; box-shadow: 0 6px 14px -8px color-mix(in srgb, var(--accent) 80%, transparent); }
  .btn[data-variant="primary"]:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
  .btn[data-variant="quiet"] { background: transparent; color: var(--ink-3); }
  .btn[data-variant="quiet"]:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink); }
  .detail-foot .grow { flex: 1; }

  /* 配置弹层 */
  .pop {
    position: fixed; z-index: 30; min-width: 184px; padding: 6px;
    background: var(--surface); border-radius: 10px;
    box-shadow: 0 0 0 1px rgba(16, 24, 40, .09), 0 18px 44px -18px rgba(16, 24, 40, .45);
    display: none;
  }
  .pop[data-open] { display: block; }
  .pop-title { padding: 6px 8px 8px; font-size: 11px; color: var(--ink-3); }
  .pop-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px; border-radius: 7px; font-size: 12.5px; color: var(--ink-2); width: 100%; text-align: left;
  }
  .pop-row:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .pop-row i { width: 7px; height: 7px; border-radius: 50%; background: var(--st); }
  .pop-row .box {
    margin-left: auto; width: 15px; height: 15px; border-radius: 4px;
    box-shadow: inset 0 0 0 1.5px var(--line-strong);
    display: grid; place-items: center; color: #fff;
  }
  .pop-row[aria-pressed="true"] .box { background: var(--accent); box-shadow: none; }
  .pop-row[aria-pressed="true"] .box svg { width: 10px; height: 10px; }
  .pop-row[data-locked] { opacity: .55; cursor: default; }

  .empty {
    grid-column: 1 / -1; min-height: 320px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    text-align: center; color: var(--ink-3); font-size: 12.5px;
  }
  .empty b { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .empty .btn { margin-top: 10px; }

  /* ── 响应式 ─────────────────────────────── */
  @media (max-width: 1439px) {
    .app { --nav-w: 196px; grid-template-columns: var(--nav-w) minmax(0, 1fr) 340px; }
  }
  @media (max-width: 1279px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 1099px) {
    .app { --nav-w: 188px; grid-template-columns: var(--nav-w) minmax(0, 1fr); }
    .detail {
      position: fixed; top: 16px; right: 16px; bottom: 16px; width: 376px; z-index: 20;
      border-left: 0; border-radius: 14px; box-shadow: var(--drawer-shadow);
      transform: translateX(calc(100% + 24px));
      transition: transform .22s cubic-bezier(.2, .7, .3, 1);
    }
    .app[data-detail="open"] .detail { transform: none; }
  }
  @media (max-width: 899px) {
    body { padding: 0; }
    .app { --nav-w: 68px; height: 100vh; border-radius: 0; }
    .brand { padding: 0; justify-content: center; }
    .brand b, .nav-label, .nav-item span, .nav-item .count, .me-text { display: none; }
    .nav-item { justify-content: center; padding: 0; }
    .nav-item svg { width: 19px; height: 19px; }
    .me { justify-content: center; }
    .topbar, .statusbar { padding-inline: 14px; }
    .grid { padding-inline: 14px; }
  }
  @media (max-width: 759px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .detail { width: auto; left: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* 收起详情：桌面上让出整列，栅格补到 4 列 */
  @media (min-width: 1100px) {
    .app[data-detail="closed"] { grid-template-columns: var(--nav-w) minmax(0, 1fr); }
    .app[data-detail="closed"] .detail { display: none; }
    .app[data-detail="closed"] .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (min-width: 1100px) and (max-width: 1439px) {
    .app[data-detail="closed"] { grid-template-columns: var(--nav-w) minmax(0, 1fr); }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="nav">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <rect x="3" y="3" width="8" height="8" rx="2.2"/>
        <rect x="13" y="3" width="8" height="8" rx="2.2"/>
        <rect x="3" y="13" width="8" height="8" rx="2.2"/>
        <rect x="13" y="13" width="8" height="8" rx="2.2"/>
      </svg>
      <b>Agent 工作台</b>
    </div>

    <div class="nav-scroll">

  // 切换状态时，若当前详情不在新列表里，就跟随到第一条，避免列表和详情说两件事
  function followActive() {
    const list = ITEMS.filter((item) => item.status === active);
    if (!list.some((item) => item.id === selected) && list[0]) selected = list[0].id;
  }

  function renderTabs() {
    bar.innerHTML = Object.entries(STATUS)
      .filter(([key]) => visible[key])
      .map(([key, meta]) => `
        <button class="tab" type="button" role="tab" data-status="${key}"
          aria-selected="${key === active}" style="--st:${meta.color}">
          <i></i>${meta.label}<b>${countOf(key)}</b>
        </button>`)
      .join("") + `<span class="grow"></span>
        <button class="ghost-btn" type="button" id="config">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 8h9M18 8h1M5 16h3M12 16h7"/><circle cx="16" cy="8" r="2"/><circle cx="10" cy="16" r="2"/></svg>
          配置状态
        </button>`;

    bar.querySelectorAll("[data-status]").forEach((tab) => {
      tab.addEventListener("click", () => {
        active = tab.dataset.status;
        followActive();
        renderTabs();
        renderGrid();
        renderDetail();
      });
    });
    document.getElementById("config").addEventListener("click", (event) => openPop(event.currentTarget));
  }

        <div class="card-meta">
          <span class="serial">${item.id}</span><span class="sep">·</span>
          <span>${item.airline}</span><span class="sep">·</span>
          <span class="ell">${item.project}</span>
        </div>
        <div class="card-foot">
          <span class="prio" data-p="${item.prio}">${item.prio}</span>
          <span class="pill">${item.branch}</span>
          <span class="grow"></span>
          ${item.comments ? `<span class="cmt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a7.5 7.5 0 0 1-11 6.6L4 20l1.4-4.4A7.5 7.5 0 1 1 20 12z"/></svg>${item.comments}</span>` : ""}
          <span>${item.updated}</span>
        </div>
      </button>`;
  }

  function renderGrid() {
    const text = query.trim().toLowerCase();
    const list = ITEMS.filter((item) => item.status === active)
      .filter((item) => !text || (item.title + item.id + item.project + item.airline).toLowerCase().includes(text));

    grid.innerHTML = list.length
      ? list.map(cardHtml).join("")
      : `<div class="empty">
           <b>没有匹配的任务</b>
           <span>换个关键词，或清除当前的搜索条件</span>
           <button class="btn" type="button" id="clearSearch">清除搜索</button>
         </div>`;

    const clear = grid.querySelector("#clearSearch");
    if (clear) clear.addEventListener("click", () => {
      query = "";
      document.getElementById("q").value = "";
      renderGrid();
    });

    grid.querySelectorAll(".card").forEach((card) => {
      card.addEventListener("click", () => { selected = card.dataset.id; renderGrid(); renderDetail(); openDetail(); });
    });
  }

  function renderDetail() {
    const item = ITEMS.find((entry) => entry.id === selected);
    if (!item) return;

    const st = STATUS[item.status];
    const ty = TYPE[item.type];
    const drift = item.localBranch !== item.envBranch;

    detail.style.setProperty("--st", st.color);

    const chains = [
      ["云效空间", item.space, "已确认", ""],
      ["代码项目", item.project, "enabled", ""],
      ["本地目录", `pier/${item.project}${item.workspaceSuffix || ""}`, "存在", ""],
      ["环境分支", item.envBranch, "环境表", ""],
      ["本地分支", item.localBranch, drift ? "不一致" : "一致", drift ? "warn" : ""],
      ["工作区", item.dirty ? "dirty" : "clean", item.dirty ? "有改动" : "干净", item.dirty ? "warn" : ""]
    ];

    detail.innerHTML = `
      <div class="detail-head">
        <div class="detail-top">
          <span class="type" style="--ty:${ty.color}">${ICON[item.type]}${ty.label}</span>
          <span class="status"><i></i>${st.label}</span>
          <span class="grow"></span>
          <button class="icon-btn" type="button" id="closeDetail" title="收起详情" aria-label="收起详情" style="box-shadow:none;background:color-mix(in srgb, var(--ink) 5%, transparent)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="m14 6-6 6 6 6"/></svg>
          </button>
        </div>
        <h2>${esc(item.title)}</h2>
        <div class="detail-sub">
          <span class="serial">${item.id}</span><span class="sep">·</span>
          <span>${item.airline}</span><span class="sep">·</span>
          <span>${item.updated}更新</span>
        </div>
      </div>

      <div class="detail-body">
        <div class="section">
          <div class="props">
            <div class="prop"><span>项目</span><b class="mono">${item.project}</b></div>
            <div class="prop"><span>分支</span><b class="mono">${item.branch}</b></div>
            <div class="prop"><span>负责人</span><b>${item.owner}</b></div>
            <div class="prop"><span>优先级</span><b>${item.prio}</b></div>
          </div>
        </div>

        <div class="section">
          <h3>描述</h3>
          <div class="prose"><p>${esc(item.desc)}</p></div>
        </div>

        <div class="section">
          <h3>可做性</h3>
          <div class="reasons">
            ${item.reasons.map(([level, text]) => `<div class="reason" data-level="${level}"><i></i><span>${esc(text)}</span></div>`).join("")}
          </div>
        </div>

        <div class="section">
          <h3>映射</h3>
          <div class="chain">
            ${chains.map(([k, v, s, state]) => `<div class="chain-row" data-state="${state}"><span class="k">${k}</span><span class="v">${esc(v)}</span><span class="s">${s}</span></div>`).join("")}
          </div>
        </div>
      </div>

      <div class="detail-foot">
        <button class="btn" type="button">打开云效</button>
        <button class="btn" type="button" data-variant="quiet">复制编号</button>
        <span class="grow"></span>
        <button class="btn" type="button" data-variant="primary">开始处理</button>
      </div>`;

    detail.querySelector("#closeDetail").addEventListener("click", closeDetail);
  }

  function openDetail() { app.dataset.detail = "open"; }
  function closeDetail() { app.dataset.detail = "closed"; }

  function openPop(anchor) {
    const box = anchor.getBoundingClientRect();
    pop.innerHTML = `<div class="pop-title">显示在首页的状态</div>` +
      Object.entries(STATUS).map(([key, meta]) => `
        <button class="pop-row" type="button" data-key="${key}"
          aria-pressed="${visible[key]}" ${key === "todo" ? "data-locked" : ""}
          style="--st:${meta.color}">
          <i></i>${meta.label}
          <span class="box">${visible[key] ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4.5 4.5L19 7"/></svg>' : ""}</span>
        </button>`).join("");

    pop.dataset.open = "1";
    pop.style.top = box.bottom + 8 + "px";
    pop.style.left = Math.max(12, box.right - pop.offsetWidth) + "px";

    pop.querySelectorAll(".pop-row").forEach((row) => {
      if (row.hasAttribute("data-locked")) return;
      row.addEventListener("click", () => {
        const key = row.dataset.key;
        const remaining = Object.entries(visible).filter(([k, v]) => v && k !== key).length;
        if (visible[key] && remaining === 0) return;
        visible[key] = !visible[key];
        if (!visible[active]) active = "todo";
        followActive();
        openPop(anchor);
        renderTabs();
        renderGrid();
        renderDetail();
      });
    });
  }

  document.addEventListener("click", (event) => {
    if (!pop.hasAttribute("data-open")) return;
    if (pop.contains(event.target) || event.target.closest("#config")) return;
    delete pop.dataset.open;
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") { delete pop.dataset.open; if (window.innerWidth < 1100) closeDetail(); }
  });

  document.getElementById("q").addEventListener("input", (event) => {
    query = event.target.value;
    renderGrid();
  });

  document.getElementById("refresh").addEventListener("click", (event) => {
    const button = event.currentTarget;
    if (button.hasAttribute("data-spin")) return;
    button.setAttribute("data-spin", "");
    window.setTimeout(() => button.removeAttribute("data-spin"), 900);
  });

  renderTabs();
  renderGrid();
  renderDetail();
</script>
</body>
</html>
